name: formatfactory
description: "Android 格式工厂：视频/音频/图片格式互转、网易云/QQ音乐/酷狗加密音乐脱壳、B站缓存无损合并为 MP4，全部本地处理"
publish_to: 'none'
version: 0.6.1+19

environment:
  sdk: ^3.13.2

dependencies:
  cross_file: ^0.3.5+5
  ffmpeg_kit_flutter_new: ^4.6.2
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.2
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: 12.0.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
