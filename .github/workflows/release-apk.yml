name: Build & Release APK

# 手动触发，或推送到形如 v* 的标签时自动构建并发布 GitHub Release。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build split APKs & create release
    runs-on: ubuntu-latest
    env:
      # 未配置签名 secrets 时为空字符串 → 还原步骤自动跳过，退回 debug 签名
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布步骤要读 annotated tag 的注释作为 Release 的「本次更新」，需确保 tag 对象在本地
          fetch-tags: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Restore release keystore (skipped when secrets are absent)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/release.jks"
          } > key.properties
          echo "已写入 android/key.properties（keystore: $RUNNER_TEMP/release.jks）"

      - name: Show which signing is used
        working-directory: android
        run: |
          if [ -f key.properties ]; then
            echo "签名方式：正式 keystore（来自 secrets）"
          else
            echo "签名方式：debug（未配置 ANDROID_KEYSTORE_BASE64 secrets）"
          fi

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release 正文 = 固定安装说明 + annotated tag 注释（即「本次更新」）。
          # 发版时把更新内容写进 tag 注释即可自动带进 Release，不必事后再 gh release edit 补写。
          # （不用 --generate-notes：本仓库直接推分支、没有 PR，自动生成的正文只有一行 Full Changelog。）
          {
            echo "自动构建于 GitHub Actions，可用下方 APK 安装：arm64-v8a（主流手机）/ armeabi-v7a（32位老机）/ x86_64（模拟器）。"
            if [ "$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null)" = "tag" ]; then
              notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
              if [ -n "$notes" ]; then
                printf '\n## 本次更新\n\n%s\n' "$notes"
              fi
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          echo "----- Release 正文 -----"
          cat "$RUNNER_TEMP/release-notes.md"
          echo "-------------------------"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME · 格式工厂 Android" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk || \
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME · 格式工厂 Android" \
              --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Upload artifacts (manual run / non-tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
